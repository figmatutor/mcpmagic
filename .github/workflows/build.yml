name: Signing certificate metadata check
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect certificate dates and identities
        shell: bash
        env:
          SIGNING_P12: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          INSTALLER_P12: ${{ secrets.INSTALLER_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for kind in signing installer; do
            if [ "$kind" = signing ]; then blob="$SIGNING_P12"; else blob="$INSTALLER_P12"; fi
            printf '%s' "$blob" | base64 --decode > "$RUNNER_TEMP/$kind.p12"
            echo "$kind certificate:"
            openssl pkcs12 -legacy -in "$RUNNER_TEMP/$kind.p12" -passin env:P12_PASSWORD -clcerts -nokeys | openssl x509 -noout -dates -fingerprint -sha1
            rm -f "$RUNNER_TEMP/$kind.p12"
          done
